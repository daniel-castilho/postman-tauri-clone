name: 'Publish Release'

on:
  push:
    tags:
      - 'app-v*'

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Universal macOS binary: covers both aarch64-apple-darwin and x86_64-apple-darwin (.dmg/.app)
          - platform: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ''
            targets: ''
          # libquickjs-sys (QuickJS sandbox) only supports MinGW/GNU on Windows;
          # MSVC cannot compile QuickJS C sources (see quick-js crate docs).
          - platform: windows-latest
            args: --target x86_64-pc-windows-gnu
            targets: x86_64-pc-windows-gnu

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Windows MUST use the GNU *host* toolchain (not just the target):
          # tauri-build/embed-resource generates resource.lib with windres,
          # which MinGW ld can read. With an MSVC host, resource.lib comes out
          # in COFF/MSVC format and linking fails ("file format not recognized").
          toolchain: ${{ matrix.platform == 'windows-latest' && 'stable-x86_64-pc-windows-gnu' || 'stable' }}
          targets: ${{ matrix.targets }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            pkg-config \
            patchelf

      - name: install frontend dependencies
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__ # tauri-action replaces \_\_VERSION\_\_ with the app version
          releaseName: 'Tyny Pulse v__VERSION__'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
