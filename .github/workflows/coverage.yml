name: 'CI — Code Coverage'

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  coverage:
    runs-on: ubuntu-22.04
    # `secrets` is not allowed in step-level `if:` expressions, so the token
    # presence flag is bridged through job env (where secrets ARE allowed).
    env:
      HAS_CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: install frontend dependencies
        run: npm ci

      - name: frontend typecheck & production build
        run: npm run build

      - name: frontend coverage (Vitest + v8, fail under 80%)
        run: npm run test:coverage

      - name: install Rust stable + llvm-tools-preview
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview, clippy

      - name: cache cargo build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            src-tauri/target
          key: ${{ runner.os }}-cargo-cov-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: install system dependencies (ubuntu)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            pkg-config \
            patchelf \
            libssl-dev \
            build-essential

      - name: install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: rust coverage (cargo-llvm-cov, fail under 80%)
        run: bash scripts/coverage-rust.sh

      - name: upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage/frontend
            coverage/rust
          if-no-files-found: warn

      - name: upload to Codecov
        if: env.HAS_CODECOV_TOKEN == 'true'
        uses: codecov/codecov-action@v5
        with:
          files: coverage/frontend/lcov.info,coverage/rust/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
