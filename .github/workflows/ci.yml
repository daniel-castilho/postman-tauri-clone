name: 'CI — Type Drift Guard'

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      # Frontend bundle is built BEFORE any Rust step: with the default
      # `custom-protocol` feature, `tauri::generate_context!` reads the
      # `frontendDist` directory (../dist) at compile time and aborts when
      # it is missing.
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: install frontend dependencies
        run: npm ci

      - name: frontend lint (eslint)
        run: npm run lint

      - name: frontend format check (prettier)
        run: npm run format:check

      - name: frontend typecheck & production build
        run: npm run build

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: cache cargo build
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      # Tauri v2 system dependencies for Linux (WebKitGTK 4.1 stack).
      # Tauri v2 requires webkit2gtk-4.1 / libsoup-3.0 / javascriptcoregtk-4.1,
      # available on Ubuntu >= 22.04. The legacy 4.0 packages satisfy Tauri v1
      # only and make javascriptcore-rs-sys/soup3-sys build scripts fail with
      # "The file `<lib>.pc` needs to be installed" errors.
      - name: install dependencies (ubuntu only)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            pkg-config \
            patchelf \
            libssl-dev \
            build-essential

      - name: rust lint (zero warnings policy)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: rust unit tests + regenerate TypeScript bindings
        working-directory: src-tauri
        run: cargo test

      - name: type drift guard (generated bindings must be up to date)
        run: |
          if [ -z "$(git status --porcelain src/types/generated)" ]; then
            echo "OK: TypeScript bindings are in sync with the Rust domain models."
          else
            echo "::error::Type drift detected! The Rust domain models changed but"
            echo "::error::src/types/generated/ was not regenerated."
            echo "::error::Fix locally with: cd src-tauri && cargo test export_ts_bindings"
            git status --porcelain src/types/generated
            git diff -- src/types/generated
            exit 1
          fi

      - name: architecture boundary check (domain/ports stay pure)
        run: |
          if grep -rEn "use crate::infrastructure" src-tauri/src/domain src-tauri/src/application/ports; then
            echo "::error::Architecture violation: domain or application ports import infrastructure."
            exit 1
          fi
          echo "OK: no infrastructure imports inside domain or application ports."
