[package]
name = "tyny-pulse"
version = "1.0.0"
edition = "2021"

[lib]
name = "tyny_pulse_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri-plugin-dialog = "2"
thiserror = "2.0"
async-trait = "0.1"
reqwest = { version = "0.12", features = ["json", "cookies", "multipart", "rustls-tls"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
quick-js = "0.4"
tokio-tungstenite = { version = "0.29.0", features = ["native-tls"] }
futures-util = { version = "0.3.32", features = ["sink"] }
axum = "0.8.8"
tower-http = { version = "0.6.8", features = ["cors"] }
serde_yaml = "0.9.34"
aes-gcm = "0.10"
base64 = "0.22"
argon2 = { version = "0.5", features = ["std", "password-hash"] }
notify = "8.2"
ts-rs = { version = "12.0", features = ["serde-json-impl"] }


[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
